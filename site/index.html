@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#0a1115;--panel:#111c20;--gold:#d9ba7e;--text:#f1eadc;--muted:#a5b5b6;--line:#bda16c32;--display:'Cinzel',Georgia,serif;--bodyfont:'DM Sans',system-ui,sans-serif;color-scheme:dark}
body{font-family:var(--bodyfont);font-size:15px;background:radial-gradient(ellipse 65% 60% at 90% 0%,#2b423b44,transparent),#0a1115}
button,input{font-family:var(--bodyfont)}
h1,h2,h3,.brand,.tile strong,.entry strong,.fiche-title,.fiche-name{font-family:var(--display);letter-spacing:.018em}
h1{font-weight:500;letter-spacing:-.025em}h2{font-size:clamp(22px,2.5vw,32px)}
aside{width:268px;background:linear-gradient(175deg,#142426,#0a1115 70%);border-right:1px solid var(--line);box-shadow:12px 0 50px #0003;padding:42px 19px}
main{margin-left:268px}.brand{font-size:24px;letter-spacing:.13em;font-weight:600;text-shadow:0 2px 22px #d9ba7e30}
.sub{font-size:9px;letter-spacing:.32em;margin-bottom:42px}
.navhead{font-family:var(--display);font-size:10px;letter-spacing:.18em;color:#c3ab7c}
.nav{display:block;border:1px solid transparent;border-radius:7px;padding:13px 14px;margin:2px 0;transition:background .2s,color .2s,border-color .2s}
.nav:hover{background:#ffffff08;border-color:#ffffff12}.nav.active{border:1px solid #caad7850;background:linear-gradient(95deg,#bba06b1e,transparent);border-left:2px solid var(--gold)}
header{min-height:80px;padding:12px clamp(22px,4vw,70px);background:#0b1417ef;backdrop-filter:blur(16px);position:sticky;top:0;z-index:3}
header input{border-radius:30px;padding:12px 19px;background:#ffffff07;max-width:390px}
.hero{padding:83px clamp(24px,6vw,110px);min-height:385px;background:radial-gradient(ellipse at 85% 60%,#9e79452d,transparent 56%),radial-gradient(ellipse at 70% 120%,#3b65582c,transparent 58%),linear-gradient(125deg,#172b2d,#0c151a 70%);border-bottom:1px solid var(--line)}
.hero:after{font-family:var(--display);color:#d0b7800d}.hero p{font-size:15px;line-height:1.9}
.content{max-width:1520px;padding:47px clamp(23px,5vw,85px) 110px}
.eyebrow,.tag{font-family:var(--bodyfont);font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tile{min-height:205px;border:1px solid var(--line);border-radius:12px;padding:29px;background:linear-gradient(155deg,#223334,#142024 74%);box-shadow:0 16px 40px #0003;transition:transform .25s,box-shadow .25s,border-color .25s}
.tile:hover{transform:translateY(-5px);box-shadow:0 20px 45px #0008}.tile strong{font-size:20px;margin:22px 0 9px}.tile .symbol{font-size:31px}
.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.entry{border-radius:12px;overflow:hidden;padding:0;text-align:left;background:linear-gradient(155deg,#1b2a2c,#101a1e);border:1px solid var(--line);box-shadow:0 12px 34px #0003;transition:transform .22s,border-color .22s,box-shadow .22s}
.entry:hover{transform:translateY(-4px);box-shadow:0 19px 42px #0007}
.entry-art{height:125px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 65%,#d9ba7e28,transparent 48%),radial-gradient(circle at 90% 0,#4c7b7266,transparent 65%),#152426;border-bottom:1px solid var(--line)}
.entry-art:before,.fiche-art:before{content:'';position:absolute;width:125px;height:125px;border:1px solid #d3ba8260;transform:rotate(45deg);box-shadow:0 0 0 24px #d3ba8208,0 0 0 48px #d3ba8204}
.entry-glyph{font-family:var(--display);font-size:57px;color:#e3c992;z-index:1;text-shadow:0 5px 30px #000c}
.entry-content{padding:20px 22px 23px}.entry strong{font-size:17px;line-height:1.4;min-height:25px}.entry p{font-size:12px;line-height:1.65;margin:8px 0 12px;min-height:40px}.entry .tag{font-size:9px}
.entry[data-type=competences] .entry-art{background:radial-gradient(circle,#ac814843,transparent 61%),#231f21}
.entry[data-type=bestiaire] .entry-art{background:radial-gradient(circle,#87635450,transparent 61%),#211e1c}
.entry[data-type=peuples] .entry-art{background:radial-gradient(circle,#43776a70,transparent 64%),#132622}
.fiche{max-width:1200px;margin:auto}.fiche-top{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:35px;align-items:stretch;margin:24px 0 28px}
.fiche-art{position:relative;min-height:315px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 45% 55%,#ab925b44,transparent 53%),linear-gradient(145deg,#24443f,#17252b 70%);border:1px solid #bba46b5c;border-radius:13px;box-shadow:inset 0 0 45px #0005,0 20px 50px #0005}
.fiche-art:before{width:185px;height:185px}.fiche-art .entry-glyph{font-size:112px}.fiche-intro{display:flex;flex-direction:column;justify-content:center}
.fiche-category{font-size:11px;letter-spacing:.23em;color:var(--gold);font-weight:700;text-transform:uppercase}
.fiche-title{font-size:clamp(27px,4.1vw,56px);line-height:1.15;margin:15px 0 12px;color:#f3e8d1;overflow-wrap:anywhere}
.fiche-summary{font-size:16px;line-height:1.8;color:#bfcaca}.fiche-badges{display:flex;flex-wrap:wrap;gap:9px;margin:19px 0}
.fiche-pill{border:1px solid #d4b58050;border-radius:100px;background:#d4b58010;color:#e3cc9b;padding:8px 12px;font-size:12px}
.fiche-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:21px 0}
.fiche-stat{background:#152428;border:1px solid var(--line);padding:17px;border-radius:10px}
.fiche-stat small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#aeb9b4;margin-bottom:10px}
.fiche-stat strong{color:#f1e4c9;font-size:17px;font-weight:600}
.fiche-section{background:linear-gradient(145deg,#17262a,#101a1e);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,3vw,35px);margin:19px 0}
.fiche-section h2{font-size:19px;margin:0 0 20px;color:#e3c78f}
.fiche-prose{font-size:14px;line-height:1.92;color:#c7d0cc;white-space:pre-wrap;overflow-wrap:anywhere}
.fiche-linklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.fiche-link{border:1px solid #baa37442;background:#ffffff05;color:#eee0be;border-radius:8px;text-align:left;padding:14px 17px;min-height:52px}
.fiche-link:hover{background:#ba9f7320;border-color:var(--gold)}
.fiche-warning{margin:22px 0;color:#c9bc9a;font-size:12px;border-left:2px solid var(--gold);padding:13px 17px;background:#d7b8750b}
.back{font-weight:600;font-size:13px;letter-spacing:.04em}.back:hover{text-decoration:underline}
@media(max-width:1200px){.entries{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.fiche-top{grid-template-columns:1fr}.fiche-art{min-height:230px}.fiche-title{font-size:35px}}
@media(max-width:680px){aside{width:265px;z-index:8}main{margin-left:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.entries{grid-template-columns:1fr}.entry-art{height:108px}.hero{padding:55px 25px}.content{padding:28px 18px 70px}.tile{min-height:165px;padding:19px}.tile strong{font-size:16px}.fiche-top{gap:20px}.fiche-art{min-height:215px}.fiche-art .entry-glyph{font-size:80px}header{min-height:65px}}
@media(max-width:420px){.grid{grid-template-columns:1fr}.tile{min-height:128px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Spectral:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap');
:root{--display:'Cormorant Garamond',Georgia,serif;--reading:'Spectral',Georgia,serif;--ui:'Manrope',system-ui,sans-serif;--gold:#cbaa72;--text:#f0e6d3;--muted:#b3c0bd;--line:#c5a46c45}
body{font-family:var(--reading);font-size:17px;letter-spacing:.003em;background:radial-gradient(circle at 90% 0%,#27473d27,transparent 45%),#0b1215}
.nav,.navhead,.sub,.tag,.eyebrow,.fiche-category,.fiche-pill,.fiche-stat,.fiche-link,.fiche-warning,header,.entry .tag,.back,.tile small,.entry p,footer,input{font-family:var(--ui)}
h1,h2,h3,.brand,.tile strong,.entry strong,.fiche-title{font-family:var(--display)}
.brand{font-size:35px;letter-spacing:.095em;font-weight:600}.sub{letter-spacing:.31em}
h1{font-size:clamp(56px,7vw,105px);font-weight:500;letter-spacing:-.037em;line-height:.97}
h2{font-size:clamp(32px,3.2vw,44px);font-weight:600;letter-spacing:-.02em}
.hero p:not(.eyebrow){font-family:var(--reading);font-size:19px;line-height:1.7}
.hero{min-height:440px;isolation:isolate}.hero:after{content:'✥';font-size:330px;right:7%;top:25px;color:#d4b77a0b}
.tile strong{font-size:31px;line-height:1.1}.tile small{font-size:12px;line-height:1.6}
.entry strong{font-size:25px;line-height:1.06;font-weight:600}.entry p{font-size:12px}
.fiche{max-width:1340px}
.fiche-top{grid-template-columns:minmax(230px,340px) minmax(0,1fr);gap:48px;margin-top:28px}
.fiche-art{min-height:350px;background:radial-gradient(circle at 50% 48%,#cab17930,transparent 44%),radial-gradient(circle at 70% 0%,#44685a44,transparent 55%),#152427}
.fiche-art:after,.entry-art:after{content:'✦';position:absolute;right:16px;bottom:11px;color:#d8bb7e70;font-size:14px}
.fiche-title{font-size:clamp(58px,6vw,94px);font-weight:600;line-height:.94;margin:22px 0}
.fiche-summary{font-family:var(--reading);font-size:21px;line-height:1.55;color:#d1d9d1}
.fiche-pill{font-size:11px;letter-spacing:.035em}
.fiche-section{padding:clamp(24px,3vw,45px);position:relative;background:radial-gradient(circle at 100% 0%,#7c69401b,transparent 44%),linear-gradient(150deg,#172529,#111a1c)}
.fiche-section:before{content:'✧';position:absolute;top:17px;right:23px;color:#bda06d70;font-size:17px}
.fiche-section h2{font-family:var(--display);font-size:36px;font-weight:600;line-height:1.05;margin-bottom:22px}
.fiche-prose{font-family:var(--reading);font-size:18px;line-height:1.9;color:#e0dfd4;max-width:77ch;white-space:pre-wrap}
.fiche-prose+.fiche-prose{margin-top:16px}
.fiche-section hr{border-color:#bba87929;margin:25px 0}
.fiche-grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px}
.fiche-stat{background:linear-gradient(140deg,#1b2b2c,#132025);border-color:#c3a8753d;min-height:94px}
.fiche-stat small{font-family:var(--ui);font-size:10px;line-height:1.4}
.fiche-stat strong{font-family:var(--ui);font-size:17px;font-weight:600}
.fiche-link{display:flex;justify-content:space-between;align-items:center;gap:12px;transition:background .2s,transform .2s}
.fiche-link:hover{transform:translateY(-2px)}
.fiche-link small{font-size:10px;display:block;color:#b6bbac;padding-top:7px}
.fiche-link .link-title{font-family:var(--display);font-size:24px;font-weight:600}
.fiche-kicker{font:700 10px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#c7af83}
.fiche-chapter{font:600 29px var(--display);color:#e8d3a5;margin:22px 0 10px}
.fiche-row{display:grid;grid-template-columns:minmax(125px,190px) minmax(0,1fr);gap:18px;padding:13px 0;border-bottom:1px solid #bba87923;font-family:var(--reading);font-size:16px}
.fiche-row strong{font:700 11px var(--ui);letter-spacing:.08em;color:#d6bd8c;text-transform:uppercase;margin-top:5px}
.fiche-skill-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fiche-skill-card{display:flex;align-items:center;gap:15px;text-align:left;padding:14px;border:1px solid #c2a57235;border-radius:10px;background:#ffffff05;color:var(--text)}
.fiche-skill-card:hover{border-color:var(--gold);background:#c4a66e15}
.fiche-skill-mark{display:grid;place-items:center;flex:0 0 52px;height:52px;border:1px solid #d8b9775e;border-radius:8px;background:radial-gradient(circle,#627b6d57,#192a2c);font:30px var(--display);color:#dfc18a}
.fiche-skill-card strong{display:block;font:600 24px var(--display);line-height:1.05}

.fiche-chapter-note{font:12px var(--ui);color:#abb9b6;line-height:1.7}
.fiche .notice{font-family:var(--ui)}

.concept-caption{font:11px var(--ui);color:#c1b7a0;letter-spacing:.05em;margin-top:8px}

/* Codex V2.2 — real class dossiers and combat compendium */
.class-hero{display:grid;grid-template-columns:minmax(220px,34%) 1fr;min-height:365px;overflow:hidden;border:1px solid #bca57350;border-radius:18px;background:radial-gradient(ellipse at 75% 0,#b99a5940,transparent 54%),linear-gradient(128deg,#1b302f,#101b20 72%);box-shadow:0 22px 70px #0007;margin:24px 0 22px}
.class-portrait{position:relative;display:flex;align-items:center;justify-content:center;min-height:360px;border-right:1px solid #c9b07d3c;background:radial-gradient(circle at 45% 48%,#b69a6645,transparent 41%),repeating-linear-gradient(45deg,transparent,transparent 26px,#d7b87a08 27px,#d7b87a08 28px)}
.class-portrait:before{content:'✧';position:absolute;font:250px var(--display);color:#d5b87811}
.class-portrait .class-concept{z-index:1;transform:scale(1.2);box-shadow:0 0 0 18px #bf9e6020,0 0 0 36px #bf9e600d,0 18px 45px #000b}
.class-copy{padding:48px clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:center;gap:12px}
.class-copy .fiche-title{margin:10px 0;font-size:clamp(62px,6.5vw,104px);overflow-wrap:anywhere}
.class-quote{font:italic 500 clamp(20px,2.2vw,28px)/1.4 var(--display);color:#e6c997;margin:4px 0 12px}
.class-summary{font:17px/1.8 var(--reading);color:#d9dfd6;max-width:62ch;margin:0}
.class-metadata{display:flex;flex-wrap:wrap;gap:10px;padding-top:15px}
.class-metadata span{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:#dfcca4;border:1px solid #d6b87855;background:#d6b8780c;padding:10px 14px;border-radius:999px}
.class-highlights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:0 0 29px}
.class-highlight{border:1px solid #c7ab7843;border-radius:15px;padding:27px 30px;background:linear-gradient(145deg,#1c2b2c,#121d20);min-width:0}
.class-highlight .fiche-kicker{display:block;margin-bottom:11px}.class-highlight h2{font:600 33px/1.1 var(--display);margin:0 0 11px;color:#f0dbb2}
.class-highlight p{font:17px/1.73 var(--reading);color:#d2d8d1;margin:0;white-space:pre-line}
.armory{border:1px solid #c7ab7844;border-radius:17px;padding:clamp(20px,4vw,44px);background:radial-gradient(circle at 88% 6%,#8a74402a,transparent 35%),linear-gradient(145deg,#172528,#101a1e);margin-bottom:23px}
.armory-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:23px;border-bottom:1px solid #d1b27b31;padding-bottom:22px}
.armory-head h2{font:600 clamp(34px,4vw,52px)/1 var(--display);margin:8px 0 0;color:#f0ddba}
.armory-count{font:600 11px var(--ui);letter-spacing:.12em;color:#cab58e;text-transform:uppercase;white-space:nowrap}
.ability-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ability-card{position:relative;display:grid;grid-template-columns:68px minmax(0,1fr);column-gap:17px;text-align:left;padding:20px;border:1px solid #bfa77946;border-radius:13px;background:linear-gradient(135deg,#223130d4,#162326);color:#f2e9d7;min-height:162px;transition:transform .2s,border-color .2s,background .2s}
.ability-card:hover{transform:translateY(-3px);border-color:#d9b979;background:linear-gradient(135deg,#2a3b37,#192928)}
.ability-index{position:absolute;right:18px;top:14px;font:600 10px var(--ui);color:#a8b3aa;letter-spacing:.15em}
.ability-icon{height:68px;width:68px;display:grid;place-items:center;align-self:start;border-radius:11px;border:1px solid #d3b5746b;background:radial-gradient(circle at 35% 30%,#af945764,transparent 50%),#1d302f;box-shadow:inset 0 0 21px #0005,0 6px 16px #0005;color:#e9ce95;font:45px var(--display)}
.ability-icon.is-concept{font-size:0;background-image:var(--ashen-concepts);background-repeat:no-repeat;background-size:272px 204px}
.ability-main{min-width:0}.ability-main strong{display:block;font:600 27px/1.05 var(--display);padding:5px 18px 7px 0;overflow-wrap:anywhere}
.ability-kind{font:700 10px var(--ui);text-transform:uppercase;letter-spacing:.12em;color:#d6b985}
.ability-description{font:13px/1.55 var(--ui);color:#bac9c2;margin:10px 0 12px;overflow-wrap:anywhere}
.ability-stats{display:flex;flex-wrap:wrap;gap:7px}
.ability-stats span{font:600 10px var(--ui);padding:6px 9px;border:1px solid #baaa8741;border-radius:6px;background:#ffffff08;color:#e0dbc8}
.ability-link{position:absolute;right:16px;bottom:12px;color:#d2b57b;font-size:18px}
.editorial-source{border:1px solid #a38c6740;border-radius:13px;background:#111b1e;margin-bottom:20px;overflow:hidden}
.editorial-source summary{cursor:pointer;padding:23px 29px;font:600 24px var(--display);color:#dec89f;list-style-position:inside}
.editorial-source summary:focus-visible{outline:2px solid #edc991;outline-offset:-3px}
.editorial-source .source-copy{padding:7px 30px 32px;font:15px/1.8 var(--reading);color:#c3d0c9;white-space:pre-wrap;max-height:520px;overflow:auto}
.editorial-source small{display:block;font:12px var(--ui);color:#a6b8b1;margin-top:7px}
.ability-profile .class-hero{grid-template-columns:220px 1fr;min-height:260px}.ability-profile .class-portrait{min-height:260px}.ability-profile .class-copy{padding:32px 42px}.ability-profile .fiche-title{font-size:clamp(43px,5vw,77px)}
.ability-profile .class-portrait .entry-glyph{font-size:100px}.ability-profile .class-portrait .class-concept{transform:scale(.85)}
.ability-profile .fiche-stat{min-height:98px}

const records=[{"id": "accordeur", "category": "classes", "title": "Accordeur", "summary": "Nain · Heal · 10 compétences de référence V0.1", "body": "VERSION DE TRAVAIL — PROVISOIRE, NON CANONIQUE\n\nPeuple : Nain\nRôle : Heal\n\nArsenal de référence — 10 compétences\n1. Note Réparatrice\nSoin — +8 Harmonie si soin utile\nCoût 0 ; CD 0 s ; portée 25 m.\nFiche : accordeur-note-reparatrice\n\n2. Vibration Apaisante\nHoT — 3 ticks en 6s; +6 Harmonie\nCoût 0 ; CD 8 s ; portée 25 m.\nFiche : accordeur-vibration-apaisante\n\n3. Accord Protecteur\nBouclier — Bouclier 6s; pas de cumul\nCoût 15 ; CD 14 s ; portée 25 m.\nFiche : accordeur-accord-protecteur\n\n4. Cercle d'Harmonie\nSoin zone — 5 alliés max; rayon 8m\nCoût 30 ; CD 16 s ; portée 12 m.\nFiche : accordeur-cercle-d-harmonie\n\n5. Grande Résonance\nSoin zone — 5 alliés; incant. 1.5s\nCoût 70 ; CD 75 s ; portée 15 m.\nFiche : accordeur-grande-resonance\n\n6. Contre-Dissonance\nDissipation — Retire 1 effet dissipable\nCoût 15 ; CD 18 s ; portée 25 m.\nFiche : accordeur-contre-dissonance\n\n7. Écho Restaurateur\nSoin — 3 rebonds; -20% par rebond\nCoût 25 ; CD 20 s ; portée 25 m.\nFiche : accordeur-echo-restaurateur\n\n8. Onde Discordante\nDégâts — +5 Harmonie si touche\nCoût 0 ; CD 9 s ; portée 20 m.\nFiche : accordeur-onde-discordante\n\n9. Cadence Secourable\nBuff — -20% incantation soins 7s\nCoût 35 ; CD 45 s ; portée 0 m.\nFiche : accordeur-cadence-secourable\n\n10. Rappel du Souffle\nRésurrection — Incant. 3s; 25% PV; limite de groupe\nCoût 50 ; CD 180 s ; portée 5 m.\nFiche : accordeur-rappel-du-souffle\n\nFiche de conception naine — transcription de la source\nASHENFALL        /     CONCORDE DES PROFONDEURS\n\n\nACCORDEUR                                                                                                             SOIGNEUR\n\n\n\n\n LE GARDIEN DES RYTHMES VIVANTS\n\n « Toute vie possède son rythme. Il suffit parfois de le retrouver. »\n\n\n IDENTITÉ & STYLE DE JEU\n Instruments de Résonance, diapasons et dispositifs de stabilisation. Soigneur qui combine soins directs,\n prévention et rétablissement progressif.\n\n\n RESSOURCE & BOUCLE DE COMBAT\n Harmonie (0-100, valeur test) : générée par les soins réellement utiles, les protections opportunes et certaines\n actions de Résonance ; dépensée pour les interventions renforcées.\n\n  Anticiper les dégâts → poser une protection ou un soin progressif → soigner efficacement → gagner de l'Harmonie → utiliser une\n  intervention de groupe ou d'urgence.\n\n\n\n ARSENAL : 10 COMPÉTENCES ÉQUIPÉES\n Les quatre premières constituent le noyau fondamental ; les six suivantes forment une configuration de référence\n personnalisable.\n\n\n   COMPÉTENCE                                 EFFET EN COMBAT\n\n\n   Note Réparatrice                           Soin direct rapide et fiable.\n\n\n   Vibration Apaisante                        Soin progressif sur une cible.\n\n\n   Accord Protecteur                          Protection préventive ciblée.\n\n\n   Cercle d'Harmonie                          Soin de zone localisé.\n\n\n   Grande Résonance                           Intervention majeure de groupe.\n\n\n   Contre-Dissonance                          Dissipe certains effets néfastes.\n\n\n   Écho Restaurateur                          Soin rebondissant entre alliés.\n\n\n   Onde Discordante                           Attaque légère et perturbation.\n\n\n   Cadence Secourable                         Fenêtre d'accélération des soins.\n\n\n   Rappel du Souffle                          Résurrection d'un allié sous conditions.\n\n\n\n\nDOSSIER DE CLASSE • VERSION DE TRAVAIL • NON CANONIQUE                                                              4/4 • PAGE 1/2\n\nASHENFALL         /   CONCORDE DES PROFONDEURS\n\n\nACCORDEUR                                                                                                    SOIGNEUR\n\n\n\n\n TROIS SPÉCIALISATIONS\n   ORIENTATION                      IDENTITÉ\n\n\n   Harmoniste                       Soins directs et de groupe ; réaction aux pics de dégâts.\n\n\n   Préservateur                     Prévention, protections et soins progressifs anticipés.\n\n\n   Dissonant                        Soin offensif et Résonance perturbatrice, sans quitter le rôle Heal.\n\n\n\n RÈGLES DE COMBAT\n • Les soins excessifs sur une cible déjà pleine ne doivent pas générer de l'Harmonie de manière abusive.\n\n • Les protections préventives et soins progressifs ne se cumulent pas sans limite.\n\n • Résurrection en combat : incantation interrompable, portée et ligne de vue limitées, restrictions communes aux\n soigneurs.\n\n • Après résurrection, la Garde antérieure d'un Tank se réactive si les deux personnages sont vivants et à portée.\n\n • L'Accordeur doit pouvoir accomplir les quêtes solo avec des dégâts modérés et une excellente survie.\n\n\n EXPÉRIENCE DE JEU\n En PvE\n Soigneur capable d'anticiper les mécaniques de boss, de gérer les dégâts de groupe et de stabiliser un Tank sous\n forte pression. Solo lent mais sûr.\n\n En PvP\n Cible prioritaire, efficace lorsqu'il anticipe le focus ennemi. Vulnérable aux interruptions, au mauvais placement et\n à l'épuisement de son Harmonie.\n\n Sur PC et mobile\n Portraits de groupe larges, sélection d'allié indépendante du ciblage ennemi, prévisualisation de portée et alertes\n sobres sur les urgences.\n\n\n POINTS À VALIDER EN PROTOTYPE\n Tester la puissance des protections anticipées, les soins en mouvement, la disponibilité de l'Harmonie et le poids\n des résurrections en PvP.\n\n\n MA REVUE PERSONNELLE\n ☐ Identité convaincante ☐ Compétences intéressantes ☐ Ressource pertinente ☐ Spécialisations variées\n\n\n Commentaires / modifications souhaitées :\n\n\n\n\nDOSSIER DE CLASSE • VERSION DE TRAVAIL • NON CANONIQUE                                                     4/4 • PAGE 2/2"}, {"id": "arcaniste", "category": "classes", "title": "Arcaniste", "summary": "Humain · DPS distance · 10 compétences de référence V0.1", "bod bre\n\n2. Surcharge\nBuff — Prochain tir +20% dégâts; +15 chaleur\nCoût 35 ; CD 18 s ; portée 0 m.\nFiche : artilleur-runique-surcharge\n\n3. Trait Perforant\nDégâts — Tir 0.8s; traverse 1 cible; +10 chaleur\nCoût 20 ; CD 14 s ; portée 27 m.\nFiche : artilleur-runique-trait-perforant\n\n4. Mine de Recul\nContrôle — Repousse 3m; 1 mine active\nCoût 0 ; CD 22 s ; portée 4 m.\nFiche : artilleur-runique-mine-de-recul\n\n5. Décharge Runique\nDégâts — +30 chaleur; incant. 1.1s\nCoût 45 ; CD 24 s ; portée 25 m.\nFiche : artilleur-runique-decharge-runique\n\n6. Salve Mécanique\nDégâts — 4 tirs; +18 Pression totale\nCoût 0 ; CD 12 s ; portée 22 m.\nFiche : artilleur-runique-salve-mecanique\n\n7. Marque de Cible\nDebuff — +8% dégâts personnels 7s\nCoût 0 ; CD 18 s ; portée 30 m.\nFiche : artilleur-runique-marque-de-cible\n\n8. Tir d'Entrave\nDégâts — Ralentissement 35% 3s\nCoût 0 ; CD 18 s ; portée 24 m.\nFiche : artilleur-runique-tir-d-entrave\n\n9. Purge des Soupapes\nRécupération — -45 chaleur\nCoût 0 ; CD 28 s ; portée 0 m.\nFiche : artilleur-runique-purge-des-soupapes\n\n10. Batterie de Forge\nInvocation — 4 tirs en 8s; 1 batterie max\nCoût 40 ; CD 45 s ; portée 18 m.\nFiche : artilleur-runique-batterie-de-forge\n\nFiche de conception naine — transcription de la source\nASHENFALL            /   CONCORDE DES PROFONDEURS\n\n\nARTILLEUR RUNIQUE                                                                                                    DPS DISTANCE\n\n\n\n\n LE MAÎTRE DES TRAJECTOIRES\n\n « Une bonne trajectoire vaut cent projectiles. »\n\n\n IDENTITÉ & STYLE DE JEU\n Arbalète mécanique ou lanceur runique, projectiles spécialisés et petits dispositifs de terrain. DPS à distance axé\n sur précision, lignes de tir et gestion des mécanismes.\n\n\n RESSOURCE & BOUCLE DE COMBAT\n Pression (0-100, valeur test) : augmente avec les tirs et sert aux attaques renforcées. Surchauffe : état provoqué\n par l'utilisation excessive de la mécanique, limitant temporairement les techniques les plus puissantes.\n\n  Choisir sa position → calibrer ses tirs → accumuler de la Pression → libérer une salve ou un tir puissant → gérer la surchauffe → se\n  repositionner.\n\n\n\n ARSENAL : 10 COMPÉTENCES ÉQUIPÉES\n Les quatre premières constituent le noyau fondamental ; les six suivantes forment une configuration de référence\n personnalisable.\n\n\n   COMPÉTENCE                                   EFFET EN COMBAT\n\n\n   Tir Calibré                                  Projectile de base précis, contribue à la Pression.\n\n\n   Surcharge                                    Convertit la Pression en puissance supplémentaire.\n\n\n   Trait Perforant                              Tir préparé traversant certaines protections.\n\n\n   Mine de Recul                                Dispositif défensif pour créer de la distance.\n\n\n   Décharge Runique                             Attaque puissante à forte consommation.\n\n\n   Salve Mécanique                              Enchaînement rapide de projectiles.\n\n\n   Marque de Cible                              Signale un point faible exploitable.\n\n\n   Tir d'Entrave                                Ralentit un adversaire.\n\n\n   Purge des Soupapes                           Réduit l'état de surchauffe.\n\n\n   Batterie de Forge                            Dispositif de tir temporaire et limité.\n\n\n\n\nDOSSIER DE CLASSE • VERSION DE TRAVAIL • NON CANONIQUE                                                                  3/4 • PAGE 1/2\n\nASHENFALL         /    CONCORDE DES PROFONDEURS\n\n\nARTILLEUR RUNIQUE                                                                                          DPS DISTANCE\n\n\n\n\n TROIS SPÉCIALISATIONS\n   ORIENTATION                      IDENTITÉ\n\n\n   Œil de Forge                     Précision monocible, tirs préparés et exploitation des faiblesses.\n\n\n   Surchargeur                      Burst à Pression élevée ; puissance contre risque de surchauffe.\n\n\n   Maître des Salves                Zone, tirs multiples et dispositifs temporaires.\n\n\n\n RÈGLES DE COMBAT\n • La ligne de vue et les obstacles comptent : pas de tirs ordinaires à travers les murs.\n\n • La Pression se construit volontairement ; la surchauffe pénalise surtout les attaques renforcées, pas les actions\n ordinaires.\n\n • Les mines et dispositifs sont limités en nombre, durée et portée pour préserver lisibilité et performances.\n\n • La classe possède des outils d'éloignement mais reste vulnérable au corps-à-corps.\n\n • Les tirs majeurs possèdent des animations et signaux identifiables par les adversaires.\n\n\n EXPÉRIENCE DE JEU\n En PvE\n Excellent pour choisir une cible dangereuse à distance, exploiter les ouvertures et contrôler les couloirs. Doit\n gérer ses positions lorsque les ennemis le rejoignent.\n\n En PvP\n Contrôle des lignes de tir, pics de dégâts annoncés et repositionnement. Contre-jeu par couverture, pression au\n contact, interruptions et exploitation de la surchauffe.\n\n Sur PC et mobile\n Jauges de Pression et surchauffe regroupées ; indicateur clair de ligne de vue ; bouton de repositionnement\n accessible sans ouvrir une palette secondaire.\n\n\n POINTS À VALIDER EN PROTOTYPE\n Tester la lisibilité des projectiles, les angles de tir sur mobile, les déployables et l'impact du réseau sur les tirs\n préparés.\n\n\n MA REVUE PERSONNELLE\n ☐ Identité convaincante ☐ Compétences intéressantes ☐ Ressource pertinente ☐ Spécialisations variées\n\n\n Commentaires / modifications souhaitées :\n\n\n\n\nDOSSIER DE CLASSE • VERSION DE TRAVAIL • NON CANONIQUE                                                        3/4 • PAGE 2/2"}, {"id": "brise-fer", "category": "classes", "title": "Brise-Fer", "summary": "Nain · DPS mêlée · 10 compétences de référence V0.1", "body": "VERSION DE TRAVAIL — PROVISOIRE, NON CANONIQUE\n\nPeuple : Nain\nRôle : DPS mêlée\n\nArsenal de référence — 10 compétences\n1. Frappe Fendante\nDégâts — +1 Fracture\nCoût 0 ; CD 0 s ; portée 3 m.\nFiche : brise-fer-frappe-fendante\n\n2. Brise-Garde\nDégâts — -10% armure 5s; +1 Fracture\nCoût 0 ; CD 12 s ; portée 3 m.\nFiche : brise-fer-brise-garde\n\n3. Élan du Marteau\nMobilité — Charge 10m; pas de stun\nCoût 0 ; CD 16 s ; portée 10 m.\nFiche : brise-fer-elan-du-marteau\n\n4. Coup de Rupture\nDégâts — Consomme 1-5 Fracture; +12%/charge\nCoût 5 ; CD 10 s ; portée 3 m.\nFiche : brise-fer-coup-de-rupture\n\n5. Onde de Choc\nZone — Ralentissement 30% 3s\nCoût 0 ; CD 18 s ; portée 5 m.\nFiche : brise-fer-onde-de-choc\n\n6. Entaille Profonde\nDoT — 3 ticks sur 6s\nCoût 0 ; CD 12 s ; portée 3 m.\nFiche : brise-fer-entaille-profonde\n\n7. Marteau du Verdict\nDégâts — Préparation 1.2s; interruptible\nCoût 0 ; CD 26 s ; portée 3 m.\nFiche : brise-fer-marteau-du-verdict\n\n8. Rythme de Forge\nBuff — +12% vitesse 8s\nCoût 0 ; CD 45 s ; portée 0 m.\nFiche : brise-fer-rythme-de-forge\n\n9. Frappe d'Entrave\nDégâts — Ralentissement 40% 3s\nCoût 0 ; CD 18 s ; portée 3 m.\nFiche : brise-fer-frappe-d-entrave\n\n10. Dernière Fissure\nExécution — Cible <30% PV; consomme 3 Fracture\nCoût 3 ; CD 25 s ; portée 3 m.\nFiche : brise-fer-derniere-fissure\n\nFiche de conception naine — transcription de la source\nASHENFALL         /    CONCORDE DES PROFONDEURS\n\n\nBRISE-FER                                                                                                            DPS MÊLÉE\n\n\n\n\n L'ARTISAN DE LA RUPTURE\n\n « Il n'existe pas d'armure sans faiblesse. »\n\n\n IDENTITÉ & STYLE DE JEU\n Marteau ou hache lourde, armure robuste. DPS de contact méthodique : il fragilise une cible, prépare une\n ouverture, puis déclenche une rupture dévastatrice.\n\n\n RESSOURCE & BOUCLE DE COMBAT\n Fracture : charges appliquées individuellement aux ennemis (plafond expérimental : 5). Certaines techniques\n ajoutent des charges ; d'autres les consomment pour des dégâts ou un affaiblissement.\n\n  Approcher → poser des charges de Fracture → maintenir le contact → identifier la bonne ouverture → consommer les charges en\n  Rupture → recommencer sur la cible suivante.\n\n\n\n ARSENAL : 10 COMPÉTENCES ÉQUIPÉES\n Les quatre premières constituent le noyau fondamental ; les six suivantes forment une configuration de référence\n personnalisable.\n\n\n   COMPÉTENCE                                EFFET EN COMBAT\n\n\n   Frappe Fendante                           Attaque fondamentale générant de la Fracture.\n\n\n   Brise-Garde                               Exploite les faiblesses et diminue temporairement une défense.\n\n\n   Élan du Marteau                           Engagement offensif et impact rapproché.\n\n\n   Coup de Rupture                           Consomme les charges de Fracture pour un coup majeur.\n\n\n   Onde de Choc                              Dégâts et perturbation sur une zone courte.\n\n\n   Entaille Profonde                         Dégâts persistants sur une cible.\n\n\n   Marteau du Verdict                        Frappe lourde annoncée par une animation lisible.\n\n\n   Rythme de Forge                           Accélère temporairement les enchaînements.\n\n\n   Frappe d'Entrave                          Ralentit la cible pour conserver le contact.\n\n\n   Dernière Fissure                          Finition conditionnelle d'une cible déjà fragilisée.\n\n\n\n\nDOSSIER DE CLASSE • VERSION DE TRAVAIL • NON CANONIQUE                                                              2/4 • PAGE 1/2\n\nASHENFALL           /   CONCORDE DES PROFONDEURS\n\n\nBRISE-FER                                                                                                  DPS MÊLÉE\n\n\n\n\n TROIS SPÉCIALISATIONS\n   ORIENTATION                      IDENTITÉ\n\n\n   Fracasseur                       Burst monocible ; Ruptures puissantes et fenêtres d'exécution.\n\n\n   Forge-Sang                       Dégâts soutenus, enchaînements réguliers et pression persistante.\n\n\n   Fracasse-Terre                   Dégâts de zone et gestion de Fracture sur plusieurs ennemis.\n\n\n\n RÈGLES DE COMBAT\n • La Fracture est attachée à la cible, non au personnage ; changer d'ennemi oblige à reconstruire la pression.\n\n • Les charges ont un plafond et une durée limitée à préciser lors des tests.\n\n • Brise-Garde n'annule jamais complètement l'armure, le blocage ou la Garde ennemie.\n\n • Les grosses frappes ont des signaux visuels et peuvent être esquivées ou interrompues selon leurs propriétés.\n\n • La classe peut survivre seule mais ne remplace pas un Tank en donjon.\n\n\n EXPÉRIENCE DE JEU\n En PvE\n Très efficace contre les élites et boss grâce à ses cycles de Fracture. La spécialisation de zone accélère le\n nettoyage des groupes, avec un risque plus élevé au contact.\n\n En PvP\n Redoutable s'il reste au corps-à-corps. Ses adversaires peuvent le ralentir, le repousser, esquiver ses Ruptures ou\n rompre sa pression en changeant de position.\n\n Sur PC et mobile\n Charges de Fracture visibles sur la cible ; compétence de Rupture clairement signalée lorsqu'elle est prête ; accès\n direct à l'approche et à l'interruption.\n\n\n POINTS À VALIDER EN PROTOTYPE\n Mesurer le temps nécessaire à la première Rupture, l'efficacité sur cibles mobiles et la frustration en cas de\n changement forcé de cible.\n\n\n MA REVUE PERSONNELLE\n ☐ Identité convaincante ☐ Compétences intéressantes ☐ Ressource pertinente ☐ Spécialisations variées\n\n\n Commentaires / modifications souhaitées :\n\n\n\n\nDOSSIER DE CLASSE • VERSION DE TRAVAIL • NON CANONIQUE                                                   2/4 • PAGE 2/2"}, {"id": "danse-lame", "category": "classes", "title": "Danse-lame", "summary": "Elfe · DPS mêlée · 10 compétences de référence V0.1", "body": "VERSION DE TRAVAIL — PROVISOIRE, NON CANONIQUE\n\nPeuple : Elfe\nRôle : DPS mêlée\n\nArsenal de référence — 10 compétences\n1. Entaille Fluide\nDégâts — +10 Cadence si alternance\nCoût 0 ; CD 0 s ; portée 3 m.\nFiche : danse-lame-entaille-fluide\n\n2. Pas de Feuille\nMobilité — Esquive 5m\nCoût 15 ; CD 12 s     Réduction directionnelle des dégâts, consomme de la Stabilité.\n\n\n   Ancrage Profond                           Résiste aux déplacements forcés et aux renversements.\n\n\n   Contre-Heurt                              Riposte puissante après un blocage réussi.\n\n\n   Cercle de Fer                             Contrôle rapproché de plusieurs adversaires.\n\n\n   Souffle du Bastion                        Fenêtre de récupération défensive.\n\n\n   Rempart Absolu                            Protection majeure de courte durée, coût élevé.\n\n\n\n\nDOSSIER DE CLASSE • VERSION DE TRAVAIL • NON CANONIQUE                                                              1/4 • PAGE 1/2\n\nASHENFALL        /     CONCORDE DES PROFONDEURS\n\n\nREMPART                                                                                                                TANK\n\n\n\n\n TROIS SPÉCIALISATIONS\n   ORIENTATION                      IDENTITÉ\n\n\n   Bastion                          Défense maximale, conservation de l'Endurance, protection de groupe.\n\n\n   Brise-Ligne                      Contre-attaques, pression offensive et charges sans quitter le rôle Tank.\n\n\n   Sentinelle d'Écho                Interruption, entrave et contrôle territorial par Résonance.\n\n\n\n RÈGLES DE COMBAT\n • Garde : une seule cible assignée, jamais soi-même ; portée test 9 m ; changement instantané et gratuit.\n\n • Mort du Tank ou de l'allié : assignation conservée, transfert suspendu puis repris automatiquement après\n résurrection et retour à portée.\n\n • Étourdissement : transfert à 50 % maintenu ; changement de cible et défenses actives indisponibles.\n\n • À zéro Endurance : bouclier abaissé, aucune rupture de contrôle ; reprise du blocage après récupération (seuil\n test 20).\n\n • Blocage parfait : meilleure réduction, bonus de Stabilité et courte fenêtre de riposte. Le transfert seul ne génère\n pas de Stabilité.\n\n\n EXPÉRIENCE DE JEU\n En PvE\n Maintient l'attention des boss, protège le ES\n\n La Concorde des Profondeurs est née de l’union de sept communautés naines. Ses cités restent autonomes\n et délèguent des représentants à un conseil commun. Il n’existe pas de monarque unique : l’équilibre\n repose sur la coopération, les accords et les standards partagés.\n\n    CINQ CITÉS DÉJÀ DÉFINIES\n\n ◆ Dûr-Kaelen\n   Cité d’accueil monumentale, centre d’ingénierie et de Résonance, organisée autour du Pilier-Cœur.\n\n ◆ Velmora\n   Cité du lac souterrain, tournée vers les voies d’eau et les transports.\n\n ◆ Kordhane\n   Forges, métallurgie et énergie géothermique.\n\n ◆ Myrvel\n   Agriculture souterraine, jardins et cultures spécialisées.\n\n ◆ Orsenn\n   Mines, reconnaissance et exploration des profondeurs.\n\n    UNE CULTURE OUVERTE SUR LE MONDE\n\n Les Nains ne craignent pas le ciel. Leurs établissements s’étendent aussi dans les vallées alpines. Les\n Grandes Voies relient leurs territoires ; la Parole Gravée rend publics les engagements importants.\n\n\n\n\nDOCUMENT DE CONCEPTION • LORE PROVISOIRE, NON CANONIQUE                                                    03 / 06"}, {"id": "dereglement", "category": "lore", "title": "Le Dérèglement", "summary": "Chroniques du monde · étude du 21 octobre 2026", "body": "VERSION DE TRAVAIL — PROVISOIRE, NON CANONIQUE\n\nASHENFALL / CHRONIQUES DU MONDE                                                          ARCHIVES DE LA TRAME\n\n\n\n\n   LE DÉRÈGLEMENT\n\nLes changements du vivant ne dessinent pas une guerre du bien contre le mal.\n\n\n\n    UNE CRISE AUX MULTIPLES VISAGES\n\n Le Dérèglement de la Trame modifie certains habitats, perturbe les mécanismes anciens et transforme des\n animaux. Tous ne deviennent pas hostiles : certains souffrent, d’autres développent une intelligence\n nouvelle, et quelques groupes commencent à former leurs propres sociétés.\n\n ◆ Altérés\n   Créatures modifiées, parfois agressives ou désorientées.\n\n ◆ Éveillés\n   Êtres dont les capacités de compréhension ont changé.\n\n ◆ Émergents\n   Groupes qui esquissent de nouvelles formes de vie collective.\n\n ◆ Instables\n   Êtres confrontés à des transformations difficiles à supporter.\n\n    UN MYSTÈRE PLUS VASTE\n\n Les perturbations ne sont pas entièrement accidentelles. Une volonté cachée agit quelque part, mais son\n identité et ses motifs appartiennent à un mystère de longue durée. Les premières aventures ne livrent que\n des indices.\n\n Les futures factions adverses devront rester crédibles et attirantes : des peuples et des groupes ayant\n leurs raisons d’agir, pas des caricatures maléfiques.\n\n\n\n\nDOCUMENT DE CONCEPTION • LORE PROVISOIRE, NON CANONIQUE                                                    05 / 06"}, {"id": "dur-kaelen-cite-vivante", "category": "lore", "title": "Dûr-Kaelen, la cité vivante", "summary": "Chroniques du monde · étude du 21 octobre 2026", "body": "VERSION DE TRAVAIL — PROVISOIRE, NON CANONIQUE\n\nASHENFALL / CHRONIQUES DU MONDE                                                            ARCHIVES DE LA TRAME\n\n\n\n\n   DÛR-KAELEN, LA CITÉ VIVANTE\n\nUn foyer à protéger, non une capitale vouée à être détruite.\n\n\n\n    UNE CITÉ AUTOUR DU PILIER-CŒUR\n\n Dûr-Kaelen accueille le joueur dans une ville chaleureuse, monumentale et active. La Place des Cent\n Voûtes, les Terrasses du Foyer, les Ateliers de l’Écho, les Jardins de Mycélune, les Quais de Basalte et la\n Salle des Mesures ont chacun leur rythme et leur utilité.\n\n    DES HABITANTS, PAS DE SIMPLES DISTRIBUTEURS DE QUÊTES\n\n ◆ Borin\n   Architecte, attaché à la solidité des ouvrages.\n\n ◆ Eldra\n   Ingénieure, spécialiste des systèmes et de leurs anomalies.\n\n ◆ Maëra\n   Jardinière, attentive aux premiers troubles du vivant.\n\n ◆ Dorrik\n   Responsable de la sécurité des installations.\n\n ◆ Tarn\n   Explorateur des voies et des régions moins connues.\n\n    LA FÊTE DES ÉCHOS\n\n L’aventure naine commence lors d’une fête locale. Le joueur participe librement aux préparatifs, rencontre\n les habitants et remarque une légère discordance. Rien ne s’effondre : l’inquiétude naît d’un détail que\n personne ne sait encore expliquer.\n\n\n\n\nDOCUMENT DE CONCEPTION • LORE PROVISOIRE, NON CANONIQUE                                                     04 / 06"}, {"id": "monde-et-trame", "category": "lore", "title": "Le monde et la Trame", "summary": "Chroniques du monde · étude du 21 octobre 2026", "body": "VERSION DE TRAVAIL — PROVISOIRE, NON CANONIQUE\n\nASHENFALL / CHRONIQUES DU MONDE                                                          ARCHIVES DE LA TRAME\n\n\n\n\n   LE MONDE ET LA TRAME\n\nUne civilisation vivante, dont l’équilibre commence à se dérégler.\n\n\n\n    UN MONDE QUI N’A PAS SOMBRÉ\n\n Ashenfall est un monde de cités prospères, de routes anciennes, de peuples autonomes et de territoires\n encore à explorer. Son histoire ne commence pas par une apocalypse : elle commence par des anomalies\n discrètes qui deviennent impossibles à ignorer.\n\n    LA TRAME\n\n La Trame est une force naturelle fondamentale reliant matière, énergie et vie. Elle peut être étudiée et\n exploitée, mais personne ne la maîtrise totalement. Lorsqu’elle se dérègle, ses effets touchent aussi bien\n les organismes vivants que les mécanismes les plus anciens.\n\n    LES PREMIERS\n\n Il y a environ dix mille ans, une civilisation commune — les Premiers — étudiait la Trame. Avec le temps,\n ses descendants ont développé des cultures distinctes. Leur séparation fut progressive et pacifique : ni\n trahison fondatrice, ni catastrophe obligatoire.\n\n Les vestiges des Premiers renferment encore des savoirs que les peuples actuels ne peuvent comprendre\n entièrement sans unir leurs disciplines.\n\n\n\n\nDOCUMENT DE CONCEPTION • LORE PROVISOIRE, NON CANONIQUE                                                     01 / 06"}, {"id": "premiers-pas-du-joueur", "category": "lore", "title": "Les premiers pas du joueur", "summary": "Chroniques du monde · étude du 21 octobre 2026", "body": "VERSION DE TRAVAIL — PROVISOIRE, NON CANONIQUE\n\nASHENFALL / CHRONIQUES DU MONDE                                                            ARCHIVES DE LA TRAME\n\n\n\n\n   LES PREMIERS PAS DU JOUEUR\n\nExplorer, comprendre, protéger : devenir acteur d’un monde déjà vivant.\n\n\n\n    LA GALERIE DES TROIS SOURCES\n\n Après la Fête des Échos, les anomalies conduisent vers une galerie d’aqueducs encore en activité. Des\n ouvriers doivent être secourus ; des créatures ont changé de comportement ; les infrastructures réagissent\n de manière inhabituelle.\n\n    LA MATRIARCHE DES FAILLES\n\n Le premier affrontement majeur oppose les joueurs à une créature fouisseuse altérée qui protège son\n territoire. Une résolution non létale pourrait être possible. L’enjeu n’est pas de tuer un monstre par\n principe, mais de comprendre pourquoi la situation a dégénéré.\n\n    UN MONDE À PARCOURIR\n\n Les Jardins de Mycélune, le Bassin des Trois Sources, les Grandes Voies, les Profondeurs de Varn et les\n Vallées de Pierreclaire constituent les premiers horizons nains. Les autres peuples possèdent leurs propres\n régions, avant la convergence vers un monde partagé.\n\n    LA PROMESSE D’ASHENFALL\n\n Le personnage n’est pas un élu annoncé par une prophétie. Il gagne sa place par ses actes, ses alliances et\n ses découvertes. L’aventure naît du monde et des gens qui y vivent.\n\n\n\n\nDOCUMENT DE CONCEPTION • LORE PROVISOIRE, NON CANONIQUE                                                    06 / 06"}, {"id": "trois-peuples-trois-savoirs", "category": "lore", "title": "Trois peuples, trois savoirs", "summary": "Chroniques du monde · étude du 21 octobre 2026", "body": "VERSION DE TRAVAIL — PROVISOIRE, NON CANONIQUE\n\nASHENFALL / CHRONIQUES DU MONDE                                                            ARCHIVES DE LA TRAME\n\n\n\n\n   TROIS PEUPLES, TROIS SAVOIRS\n\nDes origines communes, des civilisations désormais distinctes.\n\n\n\n    LES NAINS — LA MATIÈRE ET LA RÉSONANCE\n\n Ingénieurs, bâtisseurs et observateurs des profondeurs, les Nains ont fait de la Résonance une science des\n vibrations : mesurer, transmettre, construire, détecter les failles et créer de la musique. Leur culture\n valorise l’engagement tenu et l’excellence du travail.\n\n    LES ELFES — LA VIE ET SES ÉQUILIBRES\n\n Les Elfes développent des connaissances poussées sur le vivant, les écosystèmes et les manifestations\n organiques de la Trame. Leurs arts et leurs disciplines défensives privilégient l’adaptation, le mouvement\n et l’interdépendance des êtres.\n\n    LES HUMAINS — LA POLYVALENCE ARCANIQUE\n\n Les Humains explorent de multiples applications de l’énergie et des arts arcaniques. Leur force réside dans\n leur diversité de méthodes, leur capacité d’adaptation et leurs approches parfois inattendues.\n\n    UNE CONVERGENCE NATURELLE\n\n Chaque peuple commence son aventure dans une région avancée et vivante. Les routes du monde les\n amènent ensuite à se rencontrer, commercer, enquêter et affronter ensemble les conséquences du\n Dérèglement.\n\n\n\n\nDOCUMENT DE CONCEPTION • LORE PROVISOIRE, NON CANONIQUE                                                     02 / 06"}, {"id": "elfes", "category": "peuples", "title": "Elfes", "summary": "Vie et équilibres", "body": "VERSION DE TRAVAIL — PROVISOIRE, NON CANONIQUE\n\nConnaissances poussées du vivant, des écosystèmes et des manifestations organiques de la Trame. Arts et disciplines défensives fondés sur l’adaptation, le mouvement et l’interdépendance.\n\nOrigine commune : les Premiers. Chaque peuple commence dans sa propre région vivante avant de rejoindre le monde partagé.\n\nClasses étudiées\nGardien des Racines\nDanse-lame\nTraqueur sylvestre\nTisseur de Vie", "artwork": {"version": "peuples-v1", "status": "concept", "title": "Feuillage d’émeraude et argent", "description": "Élégance, nature ancienne et puissance contenue.", "alt": "Emblème conceptuel des Elfes : feuillage d’émeraude et argent.", "width": 591, "heig ert; bloque changement et défense active\nÉpuisement Rempart : À 0 Endurance, bouclier abaissé; reprise à 20 Endurance; Garde maintenue\nBlocage Rempart : Maintien -10 Endurance/s; régénération +15/s abaissé; blocage parfait + Stabilité\nBlocage parfait : Fenêtre test 0,25 s avant impact; réduction renforcée et riposte\nDiminishing returns PvP : Stun / immobilisation: 100% → 50% → 25% → immunité 18s; catégories séparées\nDurées PvP : Stun max 2s par application; immobilisation max 2s; ralentissement max 40% ordinaire\nRésurrection : Combat : 3s incantation, 180s CD, coût 50, 25% PV; limite partagée à définir\nDéfenses majeures : Ne se cumulent pas pleinement : plus forte réduction + 25% des autres réductions éligibles\nSoins : Overheal ne génère pas de ressource; boucliers similaires non empilables\nProposition de tests : Cible DPS soutenu ±5%; Tank 40-55% DPS; Heal solo 45-60% DPS\nStatut : Toutes les valeurs sont des hypothèses de prototype et nécessitent simulation + playtests"}];

const ROLE_NAMES={'Tank':'Tank','Heal':'Healer','DPS mêlée':'DPS mêlée','DPS distance':'DPS distance'};
function roleInfo(entry){
const summary=entry[3]||'',body=entry[4]||'';
const raw=(body.match(/^Rôle\s*:\s*(.+)$/m)||[])[1]||summary.split('·')[1]||'';
const role=ROLE_NAMES[raw.trim()]||raw.trim()||'À définir';
const group=/^Tank$/i.test(role)?'tank':/^Healer$/i.test(role)?'healer':'dps';
return {role,group};
}
const SPELL_TYPES={
'Soin':'Heal direct','Soin zone':'Heal de zone','HoT':'Heal sur la durée','HoT zone':'Heal de zone (HoT)',
'Dégâts':'Dégâts directs','DoT':'Dégâts DoT','Exécution':'Finisher',
'Contrôle':'Contrôle','Provocation':'Contrôle · provocation','Zone':'Dégâts de zone',
'Protection':'Protection','Défense':'Défense','Bouclier':'Bouclier',
'Buff':'Amélioration','Debuff':'Affaiblissement','Dissipation':'Dissipation',
'Résurrection':'Résurrection','Récupération':'Récupération','Mobilité':'Mobilité',
'Invocation':'Invocation','Riposte':'Riposte'
};
function spellInfo(entry){
const body=entry[4]||'',raw=((body.match(/^Type\s*:\s*(.+)$/m)||[])[1]||entry[3].split('·')[0]||'').trim();
const effect=((body.match(/^Contrôle \/ mécanique\s*:\s*(.+)$/m)||[])[1]||'').trim();
const title=entry[2]||'';
let type=SPELL_TYPES[raw]||raw||'À préciser';
if(raw==='Zone'){
if(/ralentissement|attraction|immobili|repousse/i.test(effect))type='Contrôle de zone';
else type='Dégâts de zone';
}
if(raw==='Dégâts'){
if(/finition|consomme.*(?:fracture|avantage)|coup de grâce/i.test(effect)&&/Danse Ascendante|Coup de Rupture|Riposte Magistrale/i.test(title))type='Finisher';
else if(/ralentissement|interruption/i.test(effect))type='Dégâts + contrôle';
}
if(raw==='Soin'&&/sur \d+\s*s|soin partagé \d+\s*s/i.test(effect))type='Heal sur la durée';
if(raw==='Bouclier'&&/soin déclenché/i.test(effect))type='Soin réactif';
const group=/^Heal|^Soin/.test(type)?'heal':/^Dégâts|^Finisher/.test(type)?'damage':/^Contrôle/.test(type)?'control':/^Protection|^Défense|^Bouclier|^Riposte/.test(type)?'defense':'utility';
return {type,group,raw,effect};
}
function typeTag(entry){const t=spellInfo(entry);return '<span class="spell-type" data-group="'+t.group+'">'+esc(t.type)+'</span>'}

let listingFilter='Tous',arsenalFilter='Tous',filterCategory='';
function filterButtons(options,active,scope){return '<div class="codex-filters" role="group" aria-label="Filtres de navigation">'+options.map(o=>'<button type="button" class="codex-filter" data-filter-scope="'+scope+'" data-filter-value="'+esc(o.label)+'" aria-pressed="'+(active===o.label?'true':'false')+'">'+esc(o.label)+'<span class="count">'+o.count+'</span></button>').join('')+'</div>'}
function filtersFor(items,kind,active,scope){const category=x=>kind==='classes'?roleInfo(x).role:spellInfo(x).type;const labels=[...new Set(items.map(category))].sort((a,b)=>a.localeCompare(b,'fr'));const options=[{label:'Tous',count:items.length},...labels.map(label=>({label,count:items.filter(e=>category(e)===label).length}))];return {html:filterButtons(options,active,scope),filtered:active==='Tous'?items:items.filter(e=>category(e)===active)}}
function classSkillData(entry,index){
const body=entry[4], field=(re)=>{const m=body.match(re);return m?m[1].trim():''};
return {entry,index,kind:field(/^Type\s*:\s*(.+)$/mi)||entry[3].split('·')[0],cost:field(/^Coût\s*:\s*(.+)$/mi),cd:field(/^CD\s*\(s\)\s*:\s*(.+)$/mi),range:field(/^Portée\s*\(m\)\s*:\s*(.+)$/mi),effect:field(/^Contrôle\s*\/\s*mécanique\s*:\s*(.+)$/mi)||entry[3].split('·').slice(2).join('·').trim()}
}

function cleanOverview(raw){return raw.replace(/\s+/g,' ').replace(/\s*→\s*/g,' → ').trim()}
function explainEffect(raw){
let t=String(raw||'').trim();
t=t.replace(/\bHoT\b/gi,'Soin progressif').replace(/\bDoT\b/gi,'Dégâts progressifs').replace(/\bStun\b/gi,'Étourdissement').replace(/\bTaunt\b/gi,'Provocation').replace(/\bBuff\b/gi,'Amélioration').replace(/\bDebuff\b/gi,'Affaiblissement').replace(/\bCD\b/g,'recharge').replace(/\bPvE\b/g,'contre les créatures').replace(/\bPvP\b/g,'contre les joueurs').replace(/\bincant\.\s*/gi,'incantation ').replace(/\bmax\b/g,'maximum');
t=t.replace(/;\s*/g,' · ').replace(/\s{2,}/g,' ').replace(/\b(\d+)s\b/g,'$1 s').replace(/\b(\d+)m\b/g,'$1 m');
return t;
}
function classOverview(item){
const body=item[4];
const extract=(heading,next)=>{const i=body.indexOf(heading);if(i<0)return '';let t=body.slice(i+heading.length);const ends=next.map(x=>t.indexOf(x)).filter(x=>x>=0);if(ends.length)t=t.slice(0,Math.min(...ends));return cleanOverview(t)};
const identity=extract('IDENTITÉ & STYLE DE JEU',['RESSOURCE & BOUCLE DE COMBAT','ARSENAL :']);
const resource=extract('RESSOURCE & BOUCLE DE COMBAT',['ARSENAL :','DOSSIER DE CLASSE']);
const quote=(body.match(/[«][^»]{8,170}[»]/)||[])[0]||'';
const firstSentence=identity.match(/^.{12,210}?[.!?](?=\s|$)/);
const clearIdentity=firstSentence?firstSentence[0]:identity.slice(0,220);
const resourceIntro=resource.split('→')[0].trim().slice(0,260);
const loop=resource.includes('→')?resource.slice(resource.indexOf('→')-Math.min(70,resource.lastIndexOf(' ',resource.indexOf('→'))+1)).trim().slice(0,260):'';
return {identity,resource,quote,clearIdentity,resourceIntro,loop}
}
function conceptBadge(classId){const i=featuredClassOrder.indexOf(classId);if(i<0)return '<span class="ability-icon" aria-hidden="true">✧</span>';const size=68;return '<span class="ability-icon is-concept" style="background-position:-'+(i%4*size)+'px -'+(Math.floor(i/4)*size)+'px" role="img" aria-label="Illustration conceptuelle de la classe, sans attribution définitive à la compétence"></span>'}
function renderClassDossier(item){
const id=item[0], race=classInfo[id]&&classInfo[id][0]||'';
document.body.dataset.faction=race;
const skills=data.filter(e=>e[1]==='competences'&&e[0].startsWith(id+'-'));
const overview=classOverview(item),role=roleInfo(item);
const badges=item[3].split('·').map(v=>v.trim()).filter(Boolean);
function card(e,i){
const v=classSkillData(e,i);
const stats=[v.cd!==''?'Recharge : '+(v.cd==='0'?'immédiate':v.cd+' s'):null,v.range!==''?'Portée : '+(v.range==='0'?'personnelle':v.range+' m'):null].filter(Boolean);
const name=e[2].split(' — ')[0];
return '<button class="ability-card" data-go="'+esc(e[0])+'" aria-label="Voir la compétence '+esc(name)+'"><span class="ability-index">'+String(i+1).padStart(2,'0')+' / '+String(skills.length).padStart(2,'0')+'</span>'+conceptBadge(id)+'<span class="ability-main"><span class="ability-kind">'+esc(v.kind)+'</span>'+typeTag(e)+'<strong>'+esc(name)+'</strong><span class="ability-description">'+esc(explainEffect(v.effect||e[3]))+'</span><span class="ability-stats">'+stats.map(x=>'<span>'+esc(x)+'</span>').join('')+'</span></span><span class="ability-link" aria-hidden="true">↗</span></button>'
}
return '<section class="content fiche"><button class="back" data-go="classes">← Toutes les classes</button>'+
'<div class="class-hero"><div class="class-portrait">'+classVisual(item,true)+'</div><div class="class-copy"><span class="fiche-kicker">ASHENFALL / DOSSIER DE CLASSE</span><h1 class="fiche-title">'+esc(item[2])+'</h1><span class="role-banner" data-role="'+role.group+'">'+esc(role.role)+'</span>'+(overview.quote?'<p class="class-quote">'+esc(overview.quote)+'</p>':'')+'<p class="class-summary">'+esc(overview.clearIdentity||item[3])+'</p><div class="class-metadata">'+badges.map(b=>'<span>'+esc(b)+'</span>').join('')+'</div></div></div>'+
'<div class="class-highlights"><article class="class-highlight"><span class="fiche-kicker">LE RÔLE DE CETTE CLASSE</span><h2>À quoi sert-elle ?</h2><p>'+esc(overview.identity||item[3])+'</p></article><article class="class-highlight"><span class="fiche-kicker">LES BASES DU GAMEPLAY</span><h2>Comment la jouer ?</h2><p>'+esc(overview.resourceIntro||'Consultez les archives pour les mécaniques détaillées.')+'</p></article></div>'+
'<section class="armory"><div class="armory-head"><div><span class="fiche-kicker">LES 10 CAPACITÉS</span><h2>Arsenal de compétences</h2></div><span class="armory-count">'+skills.length+' fiches · version V0.1</span></div><p class="fiche-chapter-note">Chaque compétence affiche son type : dégâts directs, DoT, finisher, contrôle, heal ou défense. Cliquez sur une carte pour consulter tous ses détails. Les icônes sont des concepts visuels, pas encore les illustrations définitives.</p>'+filtersFor(skills,'competences',arsenalFilter,'arsenal').html+'<p class="results-context">'+filtersFor(skills,'competences',arsenalFilter,'arsenal').filtered.length+' compétence(s) affichée(s)</p><div class="ability-grid">'+filtersFor(skills,'competences',arsenalFilter,'arsenal').filtered.map(e=>card(e,skills.indexOf(e))).join('')+'</div></section>'+
'<details class="editorial-source"><summary>Archives de conception originales <small>Document intégral conservé pour consultation</small></summary><div class="source-copy">'+esc(item[4])+'</div></details>'+
'<div class="fiche-warning">Version provisoire publiée · non canonique · susceptible d’évoluer.</div></section>'
}
function renderAbilityDossier(item){
const cls=getClass(item),race=cls&&classInfo[cls]?classInfo[cls][0]:'';
document.body.dataset.faction=race;
const v=classSkillData(item,0),type=spellInfo(item),b=item[4],rows=[];
const metaRegex=/^([^:\n]{2,45})\s*:\s*(.+)$/gm;let m;while((m=metaRegex.exec(b))!==null){if(/^(Peuple|Classe|Rôle|N°|Compétence|Type|Base \/ impact|Coefficient|Coût|CD \(s\)|Portée \(m\)|PvP x|Contrôle \/ mécanique|Puissance brute réf\.|Puissance PvP réf\.)$/.test(m[1].trim()))rows.push([m[1].trim(),m[2].trim()])}
const value=(key)=>{const row=rows.find(([k])=>k===key);return row?row[1]:''};
const primary=[['Coût',value('Coût')],['Recharge',value('CD (s)')?(value('CD (s)')==='0'?'Immédiate':value('CD (s)')+' s'):''],['Portée',value('Portée (m)')?(value('Portée (m)')==='0'?'Personnelle':value('Portée (m)')+' m'):'']].filter(x=>x[1]!=='');
const advanced=rows.filter(([k])=>['Base / impact','Coefficient','PvP x','Puissance brute réf.','Puissance PvP réf.'].includes(k));
return '<section class="content fiche ability-profile"><button class="back" data-go="'+esc(cls||'competences')+'">← '+esc(cls?(data.find(d=>d[0]===cls)||[])[2]||'Classe':'Compétences')+'</button><div class="class-hero"><div class="class-portrait"><span class="entry-glyph">✧</span></div><div class="class-copy"><span class="fiche-kicker">CODEX / COMPÉTENCES</span><h1 class="fiche-title">'+esc(item[2].split(' — ')[0])+'</h1>'+typeTag(item)+'<p class="class-summary">'+esc(explainEffect(v.effect||item[3]))+'</p><div class="class-metadata">'+[v.kind,...item[3].split('·').slice(1,2)].filter(Boolean).map(x=>'<span>'+esc(x.trim())+'</span>').join('')+'</div></div></div>'+
'<section class="armory"><div class="armory-head"><div><span class="fiche-kicker">EN UN COUP D’ŒIL</span><h2>Les informations essentielles</h2></div></div><div class="fiche-grid">'+primary.map(([k,value])=>'<div class="fiche-stat"><small>'+esc(k)+'</small><strong>'+esc(value)+'</strong></div>').join('')+'</div><article class="class-highlight" style="margin-top:18px"><span class="fiche-kicker">EN COMBAT</span><h2>Que fait cette compétence ?</h2><p>'+esc(explainEffect(v.effect||'Consulter la description complète.'))+'</p></article>'+ (advanced.length?'<details class="technical-extra"><summary>Afficher les valeurs d’équilibrage avancées</summary><div class="fiche-grid">'+advanced.map(([k,value])=>'<div class="fiche-stat"><small>'+esc(k)+'</small><strong>'+esc(value)+'</strong></div>').join('')+'</div></details>':'')+'</section>'+
'<details class="editorial-source"><summary>Notes d’équilibrage V0.1 <small>Hypothèses techniques, non canoniques</small></summary><div class="source-copy">'+esc(b)+'</div></details>'+
'<div class="fiche-warning">Valeurs de prototype : elles nécessitent simulation et tests en jeu.</div></section>'
}

function renderFiche(item){
const body=item[4],lines=body.split('\n'),metadata=[],description=[],related=[];
const statRegex=/^(Peuple|Rôle|Type|Coût|CD|Portée|Durée|Ressource|Niveau|Zone|Effet|Cible|Famille|Rareté|Habitat|Origine|Dégâts|Soin|Temps de recharge|Arme)\s*:\s*(.+)$/i;
for(const line of lines){const m=line.trim().match(statRegex);if(m&&metadata.length<18)metadata.push([m[1],m[2]]);else if(/^Fiche\s*:\s*/i.test(line)){const id=line.replace(/^Fiche\s*:\s*/i,'').trim();const entry=data.find(d=>d[0]===id);if(entry&&!related.some(e=>e[0]===id))related.push(entry)}else description.push(line)}
const classId=getClass(item),race=classId&&classInfo[classId]?classInfo[classId][0]:item[1]==='peuples'?({nains:'nains',elfes:'elfes',humains:'humains'})[item[0]]:'';
document.body.dataset.faction=race||'';
if(item[1]==='classes'){for(const e of data.filter(d=>d[1]==='competences'&&d[0].startsWith(item[0]+'-')))if(!related.some(x=>x[0]===e[0]))related.push(e)}
const relatedSkills=related.filter(e=>e[1]==='competences');
const text=description.join('\n').replace(/VERSION DE TRAVAIL\s*[—-]\s*PROVISOIRE, NON CANONIQUE/gi,'').trim();
const pieces=text.split(/\n\s*\n/).map(block=>block.trim()).filter(Boolean);
function proseSection(block){const lines=block.split('\n').filter(Boolean);if(lines.length===1)return '<p class="fiche-prose">'+esc(lines[0])+'</p>';const first=lines[0];if(/^Classes étudiées|^Arsenal de référence|^Compétences|^Techniques/i.test(first)){return '<h3 class="fiche-chapter">'+esc(first)+'</h3><div class="fiche-prose">'+esc(lines.slice(1).join('\n'))+'</div>'}return '<div class="fiche-prose">'+esc(block)+'</div>'}
const summaryTags=item[3].split('·').map(x=>x.trim()).filter(Boolean).slice(0,4);
const title=categoryMap[item[1]]||'Archives';
const relatedBlock=relatedSkills.length?'<section class="fiche-section"><span class="fiche-kicker">GRIMOIRE / ARSENAL</span><h2>Compétences associées <span style="opacity:.5">('+relatedSkills.length+')</span></h2><div class="fiche-skill-list">'+relatedSkills.map(e=>'<button class="fiche-skill-card" data-go="'+esc(e[0])+'"><span class="fiche-skill-mark" aria-hidden="true">✧</span><span><strong>'+esc(e[2])+'</strong><small>'+esc(e[3])+'</small></span></button>').join('')+'</div></section>':related.length?'<section class="fiche-section"><h2>Fiches associées</h2><div class="fiche-linklist">'+related.map(e=>'<button class="fiche-link" data-go="'+esc(e[0])+'"><span class="link-title">'+esc(e[2])+'</span> ↗</button>').join('')+'</div></section>':'';
const art='<div class="fiche-art"'+(peupleArtwork(item)?' data-artwork="peuples-v1"':' aria-label="Emblème conceptuel de la catégorie"')+'>'+classVisual(item,true)+(peupleArtwork(item)?'<span class="peuple-art-status">EMBLÈME · CONCEPT V1</span>':'')+'</div>';
const note=preview?'Brouillon privé. Ce contenu ne constitue pas le canon officiel.':body.startsWith('VERSION DE TRAVAIL')?'Version provisoire publiée · non canonique · susceptible d’évoluer.':'Contenu approuvé pour publication.';
return '<section class="content fiche"><button class="back" data-go="'+esc(item[1])+'">← Retour · '+esc(title)+'</button><div class="fiche-top">'+art+'<div class="fiche-intro"><span class="fiche-category">✦ CODEX / '+esc(title)+'</span><h1 class="fiche-title">'+esc(item[2])+'</h1><p class="fiche-summary">'+esc(item[3])+'</p><div class="fiche-badges">'+summaryTags.map(t=>'<span class="fiche-pill">'+esc(t)+'</span>').join('')+'</div><span class="tag">'+badgeText(item)+'</span></div></div>'+
(metadata.length?'<div class="fiche-grid">'+metadata.map(([k,v])=>'<div class="fiche-stat"><small>'+esc(k)+'</small><strong>'+esc(v)+'</strong></div>').join('')+'</div>':'')+
'<article class="fiche-section"><span class="fiche-kicker">CHRONIQUES · '+esc(title)+'</span><h2>'+esc(item[1]==='competences'?'Effets & fonctionnement':item[1]==='peuples'?'Histoire & héritage':item[1]==='bestiaire'?'Nature & observations':'Archives & savoirs')+'</h2>'+pieces.map(proseSection).join('<hr>')+'</article>'+relatedBlock+
'<div class="fiche-warning">'+esc(note)+'</div></section>'
}
function render(){let route;try{route=decodeURIComponent(location.hash.slice(2)||'home')}catch{route='home'}let q=fold(search.value.trim()),cat=cats.find(c=>c[0]===route),item=data.find(e=>e[0]===route);document.querySelectorAll('.nav').forEach(n=>{const active=n.dataset.go===(cat?route:item?item[1]:'home');n.classList.toggle('active',active);if(active)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});document.getElementById('crumb').textContent='ASHENFALL / '+(cat?cat[1]:item?item[2]:'ACCUEIL').toUpperCase();if(q){let hits=data.filter(e=>fold(e.slice(2).join(' ')).includes(q));view.innerHTML='<section class="content"><h2>Résultats de recherche ('+hits.length+')</h2>'+cards(hits)+'</section>';return}if(item){view.innerHTML=renderFiche(item);return}if(cat){let items=data.filter(e=>e[1]===route);document.body.dataset.faction='';if(filterCategory!==route){listingFilter='Tous';filterCategory=route}const filt=(route==='classes'||route==='competences')?filtersFor(items,route,listingFilter,'catalogue'):{html:'',filtered:items};view.innerHTML='<section class="hero"><p class="eyebrow">ENCYCLOPÉDIE</p><h1>'+esc(cat[1])+'</h1><p>'+esc(cat[3])+'</p></section><section class="content"><h2>Explorer les fiches</h2>'+filt.html+'<p class="results-context"><strong>'+filt.filtered.length+'</strong> sur '+items.length+' fiches affichées</p>'+cards(filt.filtered)+'</section>';return}view.innerHTML='<section class="hero"><p class="eyebrow">LES ARCHIVES D’UN MONDE EN DEVENIR</p><h1>Un monde.<br><em>Mille histoires.</em></h1><p>Explorez les peuples, les classes et les mystères d’un univers façonné pierre après pierre.</p></section><section class="content"><div class="sectionhead"><p class="eyebrow">LE CODEX D’ASHENFALL</p><h2>Les portes du savoir</h2><p>Choisissez une archive pour commencer votre exploration.</p></div><div class="grid">'+cats.map(c=>'<button class="tile" data-go="'+c[0]+'"><span class="symbol">'+c[2]+'</span><strong>'+esc(c[1])+'</strong><small>'+esc(c[3])+'</small></button>').join('')+'</div><h2 style="margin-top:45px">Premières archives</h2>'+cards([...data.filter(e=>e[1]==='peuples'),...data.filter(e=>e[1]!=='peuples')].slice(0,4))+'</section>'}
document.addEventListener('click',e=>{const filter=e.target.closest('[data-filter-scope]');if(filter){if(filter.dataset.filterScope==='arsenal')arsenalFilter=filter.dataset.filterValue;else listingFilter=filter.dataset.filterValue;render();return}let el=e.target.closest('[data-go]');if(el){location.hash='#/'+encodeURIComponent(el.dataset.go);search.value='';arsenalFilter='Tous';render();document.getElementById('side').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');view.focus();window.scrollTo({top:0,behavior:'instant'})}});search.addEventListener('input',render);window.addEventListener('hashchange',render);document.getElementById('mode').textContent=preview?'✦ Aperçu privé · contenu à valider':'✦ Encyclopédie · version provisoire';document.getElementById('menu').setAttribute('aria-expanded','false');document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('side').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')}});document.getElementById('menu').addEventListener('click',()=>{const open=document.getElementById('side').classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});render();
</script></body></html>
