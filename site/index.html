<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashenfall — Codex</title>
<style>
:root{color-scheme:dark;--bg:#10161c;--panel:#1b252d;--gold:#d4b47b;--text:#e9e4d9;--muted:#aab2b4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}aside{width:245px;background:#151f26;border-right:1px solid #38434a;padding:30px 16px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font:28px Georgia,serif;letter-spacing:3px;color:var(--gold);text-align:center;margin:10px 0 5px}.sub{text-align:center;color:var(--muted);font-size:10px;letter-spacing:3px;margin-bottom:38px}.nav{width:100%;text-align:left;background:transparent;color:#c2c9c9;border:0;padding:13px;border-radius:6px}.nav:hover,.nav.active{background:#2d3b43;color:var(--gold)}.navhead{color:var(--gold);font-size:11px;letter-spacing:2px;margin:26px 12px 10px}main{margin-left:245px}header{padding:16px 5%;border-bottom:1px solid #38434a;display:flex;justify-content:space-between;align-items:center;gap:20px}.crumb{color:var(--gold);font-size:12px;letter-spacing:1px}input{background:#202b33;color:var(--text);border:1px solid #465057;border-radius:6px;padding:12px;max-width:360px;width:55%}.hero{padding:65px 6%;background:radial-gradient(circle at 85% 25%,#79613b50,transparent 48%),linear-gradient(120deg,#26353d,#111a21);border-bottom:1px solid #5d4e38}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold)}h1{font:normal clamp(36px,5vw,65px) Georgia,serif;margin:15px 0}p{color:var(--muted);line-height:1.75}.hero p{max-width:570px}.content{padding:36px 5% 80px}h2{font:normal 28px Georgia,serif;color:#f2e9d8}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{background:linear-gradient(135deg,#293941,#1b262e);border:1px solid #465057;border-radius:8px;padding:24px;min-height:155px;text-align:left;color:var(--text)}.tile:hover,.entry:hover{border-color:var(--gold)}.tile .symbol{font-size:28px;color:var(--gold)}.tile strong{display:block;font:normal 21px Georgia,serif;margin:16px 0 4px}.tile small{color:var(--muted);line-height:1.5}.entries{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.entry{border:1px solid #465057;background:var(--panel);border-radius:7px;padding:19px;color:var(--text);text-align:left}.entry strong{display:block;font:normal 19px Georgia,serif}.entry small{color:var(--muted)}.tag{color:var(--gold);font-size:10px;display:block;margin-top:12px}.notice{border-left:2px solid var(--gold);background:#302c24;color:#d6c6a7;padding:15px;margin-top:24px}.back{border:0;background:none;color:var(--gold);padding:0}.body{padding:26px;background:var(--panel);border:1px solid #465057;border-radius:7px;margin-top:22px;line-height:1.8}.empty{border:1px dashed #465057;padding:30px;color:var(--muted)}footer{text-align:center;padding:25px;border-top:1px solid #38434a;color:var(--muted);font-size:11px}.menu{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){aside{z-index:5;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}main{margin:0}.menu{display:block;background:none;color:var(--gold);border:0;font-size:24px}.crumb{display:none}.grid,.entries{grid-template-columns:1fr}.hero{padding:48px 24px}.content{padding:28px 20px 65px}}

:root{--bg:#101416;--panel:#191e20;--gold:#d1b47f;--muted:#b3b9b5}body{background:radial-gradient(ellipse at top right,#30392e44,transparent 70%),var(--bg)}aside{background:#111719;border-color:#c7ac7430;width:250px;padding-top:40px}.brand{font-size:25px;letter-spacing:4px}.sub{font-size:9px;color:#d1b47f99;margin-top:12px}main{margin-left:250px}header{min-height:83px;background:#111719aa;border-color:#c7ac7425}input{border-radius:3px;background:#ffffff04;border-color:#bda37440}.hero{position:relative;overflow:hidden;min-height:370px;padding:76px 6%;background:radial-gradient(ellipse at 80% 100%,#a58c4840,transparent 52%),linear-gradient(120deg,#1b2829,#152021 60%,#30392d);border-color:#c6aa6c50}.hero:after{content:'✧';position:absolute;right:8%;top:20px;font:290px Georgia;color:#cab07515;transform:rotate(12deg);pointer-events:none}h1{letter-spacing:-2px;line-height:1.08;font-size:clamp(42px,5.3vw,76px)}h1 em{color:var(--gold);font-weight:normal}.hero p{max-width:550px}.eyebrow{letter-spacing:3px;font-size:10px}.content{max-width:1500px;margin:auto;padding-top:36px}.sectionhead{margin-bottom:26px}.sectionhead h2{margin:8px 0}.sectionhead p:last-child{font-size:13px}.grid{gap:18px}.tile{position:relative;min-height:180px;border-radius:3px;border-color:#bca47435;background:radial-gradient(circle at 100% 0,#9d8c5330,transparent 70%),#1a2324;transition:transform .2s,border-color .2s}.tile:nth-child(3n+2){background:radial-gradient(circle at 100% 0,#47756335,transparent 70%),#182222}.tile:hover{transform:translateY(-3px)}.tile:after{content:'↗';position:absolute;right:22px;top:25px;color:#d1b47f88}.tile strong{font-size:23px}.tile small{font-size:12px}.entry{border-radius:3px;background:#ffffff03;border-color:#bca47430}.tag{letter-spacing:1.5px;font-size:9px}.notice{font-size:13px}.nav{border-radius:3px;font-size:13px}.nav.active{background:#c5ae7614;border-left:2px solid var(--gold)}.body{border-radius:3px;max-width:850px;white-space:pre-line}.skip{position:fixed;top:-60px;z-index:20;background:#d1b47f;color:#111;padding:15px}.skip:focus{top:0}:focus-visible{outline:2px solid #ebcf94;outline-offset:4px}button{min-height:44px}hr{border:0;border-top:1px solid #bca47430;margin:25px 0}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){main{margin-left:0}.hero{min-height:330px;padding:55px 24px}.hero:after{right:-40px}.grid{grid-template-columns:1fr 1fr;gap:10px}.tile{padding:18px;min-height:165px}.tile strong{font-size:20px}.tile:after{display:none}header input{width:100%;max-width:none}.menu{flex-shrink:0}.entries{grid-template-columns:1fr}h1{letter-spacing:-1px}.nav{font-size:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><aside id="side"><div class="brand">ASHENFALL</div><div class="sub">THE WORLD CODEX</div><nav id="nav"></nav><p style="font-size:12px;margin:35px 12px"><span id="mode">✦ Archives d’Ashenfall</span></p></aside><main id="main"><a class="skip" href="#main">Aller au contenu</a><header><button class="menu" id="menu" aria-label="Ouvrir le menu">☰</button><span class="crumb" id="crumb">ASHENFALL / ACCUEIL</span><input type="search" id="search" placeholder="⌕ Rechercher..." aria-label="Rechercher"></header><div id="view" tabindex="-1" aria-live="polite"></div><footer>ASHENFALL · LES ARCHIVES DU MONDE</footer></main>
<script>
const cats=[['peuples','Peuples','♜','Civilisations et origines'],['classes','Classes','⚔','Les voies du combat'],['competences','Compétences','✧','Arts et pouvoirs'],['bestiaire','Bestiaire','♞','Créatures du monde'],['equipements','Équipements','⛨','Armes et armures'],['regions','Régions','⌖','Terres et territoires'],['lore','Histoires & Lore','❖','Chroniques et légendes'],['chronologie','Chronologie','◷','Les âges du monde'],['systemes','Systèmes de jeu','◇','Comprendre les mécaniques']];
const preview=false;
const records=[];
const data=records.map(e=>[e.id,e.category,e.title,e.summary,e.body]);
const fold=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nav=document.getElementById('nav'),view=document.getElementById('view'),search=document.getElementById('search');
nav.innerHTML='<div class="navhead">EXPLORER</div><button class="nav" data-go="home">⌂ &nbsp; Accueil</button><div class="navhead">ENCYCLOPÉDIE</div>'+cats.map(c=>'<button class="nav" data-go="'+c[0]+'">'+c[2]+' &nbsp; '+esc(c[1])+'</button>').join('');
function cards(items){return items.length?'<div class="entries">'+items.map(e=>'<button class="entry" data-go="'+e[0]+'"><strong>'+esc(e[2])+'</strong><p>'+esc(e[3])+'</p><span class="tag">'+(preview?'BROUILLON · PRIVÉ':'ARCHIVE PUBLIÉE')+'</span></button>').join('')+'</div>':'<div class="empty">Aucune fiche pour le moment. Les contenus seront ajoutés après validation.</div>'}
function render(){let route;try{route=decodeURIComponent(location.hash.slice(2)||'home')}catch{route='home'}let q=fold(search.value.trim()),cat=cats.find(c=>c[0]===route),item=data.find(e=>e[0]===route);document.querySelectorAll('.nav').forEach(n=>{const active=n.dataset.go===(cat?route:item?item[1]:'home');n.classList.toggle('active',active);if(active)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});document.getElementById('crumb').textContent='ASHENFALL / '+(cat?cat[1]:item?item[2]:'ACCUEIL').toUpperCase();if(q){let hits=data.filter(e=>fold(e.slice(2).join(' ')).includes(q));view.innerHTML='<section class="content"><h2>Résultats de recherche ('+hits.length+')</h2>'+cards(hits)+'</section>';return}if(item){view.innerHTML='<section class="content"><button class="back" data-go="'+item[1]+'">← Retour</button><p class="eyebrow">ARCHIVES · '+(preview?'FICHE PROVISOIRE':'CODEX')+'</p><h1>'+esc(item[2])+'</h1><div class="body">'+esc(item[3])+'<hr><p>'+esc(item[4])+'</p><p></p></div><div class="notice">'+(preview?'Brouillon privé. Ce contenu ne constitue pas le canon officiel.':'Contenu approuvé pour publication.')+'</div></section>';return}if(cat){let items=data.filter(e=>e[1]===route);view.innerHTML='<section class="hero"><p class="eyebrow">ENCYCLOPÉDIE</p><h1>'+esc(cat[1])+'</h1><p>'+esc(cat[3])+'</p></section><section class="content"><h2>Fiches disponibles</h2>'+cards(items)+'</section>';return}view.innerHTML='<section class="hero"><p class="eyebrow">LES ARCHIVES D’UN MONDE EN DEVENIR</p><h1>Un monde.<br><em>Mille histoires.</em></h1><p>Explorez les peuples, les classes et les mystères d’un univers façonné pierre après pierre.</p></section><section class="content"><div class="sectionhead"><p class="eyebrow">LE CODEX D’ASHENFALL</p><h2>Les portes du savoir</h2><p>Choisissez une archive pour commencer votre exploration.</p></div><div class="grid">'+cats.map(c=>'<button class="tile" data-go="'+c[0]+'"><span class="symbol">'+c[2]+'</span><strong>'+esc(c[1])+'</strong><small>'+esc(c[3])+'</small></button>').join('')+'</div><h2 style="margin-top:45px">Premières archives</h2>'+cards([...data.filter(e=>e[1]==='peuples'),...data.filter(e=>e[1]!=='peuples')].slice(0,4))+'</section>'}
document.addEventListener('click',e=>{let el=e.target.closest('[data-go]');if(el){location.hash='#/'+encodeURIComponent(el.dataset.go);search.value='';render();document.getElementById('side').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');view.focus();window.scrollTo({top:0,behavior:'instant'})}});search.addEventListener('input',render);window.addEventListener('hashchange',render);document.getElementById('mode').textContent=preview?'✦ Aperçu privé · contenu à valider':'✦ Encyclopédie d’Ashenfall';document.getElementById('menu').setAttribute('aria-expanded','false');document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('side').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')}});document.getElementById('menu').addEventListener('click',()=>{const open=document.getElementById('side').classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});render();
</script></body></html>
