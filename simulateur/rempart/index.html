<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashenfall — Maîtrises intégrées au Codex</title><style>body{margin:0;padding:12vh 8vw;background:#06131c;color:#e9dfca;font:18px/1.7 Georgia,serif}a{color:#dfbd80}p{max-width:60ch}</style></head><body><h1>Les maîtrises sont dans le Codex</h1><p>Votre ancienne sauvegarde reste conservée. Retrouvez désormais la préparation de votre classe dans son onglet Maîtrises.</p><a href="../../#/rempart/maitrises">Ouvrir les maîtrises dans le Codex</a><script>(() => {
 const allowed = ["accordeur", "arcaniste", "artilleur-runique", "brise-fer", "danse-lame", "duelliste", "gardien-des-racines", "rempart", "sentinelle", "thaumaturge", "tisseur-de-vie", "traqueur-sylvestre", "porte-faille", "fendeur", "eclateur", "lieur", "enlaceur", "mue-lame", "aiguilleur", "eveilleur", "brise-courant", "sillonneur", "lance-rive", "passeur"];
 let previous='';try{previous=decodeURIComponent(location.hash.replace(/^#\/?/, '').split('/')[0]);}catch{}
 const requested = new URLSearchParams(location.search).get('classe');
 const id = true ? 'rempart' : allowed.includes(previous) ? previous : allowed.includes(requested) ? requested : 'accordeur';
 const url = new URL('../../',location.href);
 url.hash='/'+id+'/maitrises'+(id==='rempart'?'?mode='+'v8':'');
 location.replace(url.href);
})();</script></body></html>
