name: Deploy approved public Codex
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact public commit explicitly approved by Clement for deployment
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: codex-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'ClementChatain/Ashenfall-Codex-Public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require explicitly approved commit
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: test "$APPROVED_COMMIT" = "$GITHUB_SHA"
      - name: Verify complete public release
        run: |
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_public_v2.py --for-deployment
      - name: Package the allowlisted public Codex and ability icons
        run: |
          test -s site/index.html
          mkdir -p pages-output
          cp site/index.html pages-output/index.html
          # Public bestiary: only the five supplied web files, never Unity assets.
          cp -R site/bestiaire pages-output/bestiaire
          if [ -d site/chroniques ]; then
            cp -R site/chroniques pages-output/chroniques
          fi
          if [ -d site/assets/abilities ]; then
            mkdir -p pages-output/assets
            cp -R site/assets/abilities pages-output/assets/abilities
          fi
          if [ -d site/assets/emblems ]; then
            mkdir -p pages-output/assets
            cp -R site/assets/emblems pages-output/assets/emblems
          fi
          if [ -d site/assets/classes ]; then
            mkdir -p pages-output/assets
            cp -R site/assets/classes pages-output/assets/classes
          fi
          # User-supplied music and the persistent native player.
          mkdir -p pages-output/assets
          cp -R site/assets/audio pages-output/assets/audio
          cp -R site/assets/music-player-v1 pages-output/assets/music-player-v1
          # Approved public simulator, kept separate from the validated lore records.
          test -s simulateur/rempart/index.html
          mkdir -p pages-output/simulateur/rempart
          cp simulateur/rempart/index.html pages-output/simulateur/rempart/index.html
          test -s simulateur/classes/index.html
          mkdir -p pages-output/simulateur/classes
          cp simulateur/classes/index.html pages-output/simulateur/classes/index.html
          # Approved generated project documentation; game sources never enter this directory.
          test -s site/espace-travail/manifest.json
          cp -R site/espace-travail pages-output/espace-travail
          touch pages-output/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

